<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Arbeitszeitbetrug Arcade</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <span class="icon">💼</span>
      <h2>Arbeitszeitbetrug</h2>
    </div>
    <p class="desc">Tic-Tac-Toe & 4-Gewinnt direkt auf jeder Website!</p>

    <button id="btn-reopen" class="btn-reopen">💼 Menu wieder öffnen / einblenden</button>

    <div class="shortcut-info">
      <span>Tastenkombination:</span> <code>Alt + A</code>
    </div>

    <div class="features">
      <div class="feat-item">
        <span>❌⭕</span> <b>Tic-Tac-Toe</b> (vs AI / P2P)
      </div>
      <div class="feat-item">
        <span>🔴🟡</span> <b>4-Gewinnt</b> (vs AI / P2P)
      </div>
      <div class="feat-item">
        <span>🌐</span> <b>P2P Room Codes</b>
      </div>
    </div>

    <div class="footer">
      <span>Arbeitszeitbetrug v2.3</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
